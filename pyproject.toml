[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fishmemory-local"
version = "0.3.0"
description = "Local durable memory with MCP read/write tools"
requires-python = ">=3.11"
dependencies = ["mcp==1.26.0"]

[project.scripts]
fishmemory = "fishmemory.__main__:main"
fishmemory-mcp = "fishmemory.mcp_server:main"
fishmemory-integrate = "fishmemory.integration:main"

[tool.setuptools.packages.find]
include = ["fishmemory*"]

[tool.setuptools.package-data]
fishmemory = ["assets/fishmemory/SKILL.md"]

