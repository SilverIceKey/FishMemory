# FishMemory 归档插件 bundle patch（docs/16-DSH原生插件集成.md §6 默认值）。
# 安装前请按目标机器修改：
# - tokenFile：指向 `.fishmemory/service.token` 的绝对路径；由
#   `python -m fishmemory init --config fishmemory.local.json` 生成，插件只读取、不写入。
# - serviceUrl：与 `python -m fishmemory serve` 绑定的 http://127.0.0.1:<port> 一致。
# userId/agentId 为契约保留字段：本轮插件不向 HTTP 请求体发送身份，scope 由本地服务配置强制；
# heartbeatFile 同为保留字段，当前实现不写心跳文件（README“未实现”一节）。
- insert:
    - id: fishmemory-guidance
      name: '@fishmemory/dsh-fishmemory/guidance'
    - id: fishmemory-archive
      name: '@fishmemory/dsh-fishmemory'
      config:
        serviceUrl: http://127.0.0.1:8765
        tokenFile: 'D:/Project/Ai/FishMemory/FishMemory-Project-Spec/.fishmemory/service.token'
        userId: local
        agentId: dsh
        topic: 会话
        archiveUser: true
        archiveAssistant: true
        archiveToolResults: false
        maxTextChars: 4000
        batchSize: 16
        flushDelayMs: 800
        requestTimeoutMs: 5000
        maxRetries: 5
        maxQueue: 512
        heartbeatFile: ''

